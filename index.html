<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>まち紹介ディスプレイ</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="まち紹介">
<meta name="theme-color" content="#000000">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-180.png">
<link rel="manifest" href="manifest.webmanifest">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DotGothic16&display=swap" rel="stylesheet">
<style>
  /* 画面構成: 上=ステータス行(GPS状態) / 中央=カテゴリ名+ドット文字のカード / 下=操作ボタン */
  :root {
    --bg: #000000;
    --panel: #0a0b0e;
    --ink: #eef3ff;
    --dim: #7d8696;
    --ok: #7dffa6;
    --warn: #ffcf5a;
    --font: "DotGothic16", "Hiragino Kaku Gothic ProN", "Hiragino Sans", sans-serif;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; margin: 0; background: var(--bg); color: var(--ink); font-family: var(--font); }
  body {
    display: flex; flex-direction: column; gap: 10px;
    padding: max(14px, env(safe-area-inset-top)) max(16px, env(safe-area-inset-right)) max(14px, env(safe-area-inset-bottom)) max(16px, env(safe-area-inset-left));
    overflow: hidden; user-select: none; -webkit-user-select: none;
  }
  #status {
    display: flex; flex-wrap: wrap; gap: 4px 14px;
    font-size: 15px; letter-spacing: .04em; color: var(--dim);
  }
  #status b { font-weight: normal; color: var(--ink); }
  #status .ok { color: var(--ok); }
  #status .warn { color: var(--warn); }
  #panel {
    flex: 1; min-height: 0; border-radius: 6px; background: var(--panel);
    border: 1px solid #1b1e26; padding: 12px 16px 22px; position: relative; overflow: hidden;
    display: flex; flex-direction: column; gap: 8px;
  }
  #tag { font-size: 16px; letter-spacing: .12em; color: var(--warn); min-height: 1.3em; }
  #tag.eki { color: var(--ok); }
  #tag.title { color: var(--dim); }
  #screen {
    flex: 1; min-height: 0; overflow: hidden; line-height: 1.28; letter-spacing: 0;
    white-space: pre-wrap; word-break: break-all; color: var(--ink);
    text-shadow: 0 0 6px rgba(190, 210, 255, .35);
  }
  #screen.title { color: #fff; }
  #screen.eki { color: var(--ok); text-shadow: 0 0 6px rgba(125, 255, 166, .35); }
  #pager { position: absolute; right: 12px; bottom: 6px; font-size: 13px; color: var(--dim); }
  #bar { display: flex; gap: 10px; }
  #bar button {
    flex: 1; font: inherit; font-size: 17px; color: var(--ink); background: #11141a;
    border: 1px solid #262b36; border-radius: 6px; padding: 14px 6px; min-height: 52px;
  }
  #bar button:active { background: #1c212b; }
  #bar button:focus-visible { outline: 2px solid var(--ok); outline-offset: 2px; }

  #intro {
    position: fixed; inset: 0; background: var(--bg); z-index: 5;
    display: flex; flex-direction: column; justify-content: center; gap: 18px;
    padding: max(24px, env(safe-area-inset-top)) max(28px, env(safe-area-inset-right)) max(24px, env(safe-area-inset-bottom)) max(28px, env(safe-area-inset-left));
  }
  #intro h1 { margin: 0; font-weight: normal; font-size: 34px; line-height: 1.3; text-wrap: balance; }
  #intro p { margin: 0; color: var(--dim); font-size: 16px; line-height: 1.7; max-width: 30em; }
  #intro .btns { display: flex; flex-direction: column; gap: 12px; max-width: 360px; }
  #intro button {
    font: inherit; font-size: 20px; padding: 16px; border-radius: 6px; border: 1px solid #2d3340;
    background: #11141a; color: var(--ink);
  }
  #intro button.main { background: var(--ink); color: #000; border-color: var(--ink); }
  #intro button:focus-visible { outline: 2px solid var(--ok); outline-offset: 2px; }
  [hidden] { display: none !important; }
</style>
</head>
<body>

<div id="status" aria-live="polite">
  <span>GPS:<b id="st-gps">--</b></span>
  <span>精度:<b id="st-acc">--</b></span>
  <span>向き:<b id="st-dir">--</b></span>
  <span>NET:<b id="st-net">--</b></span>
</div>

<div id="panel">
  <div id="tag" class="title"></div>
  <div id="screen" class="title">GPSを待っています…</div>
  <div id="pager"></div>
</div>

<div id="bar">
  <button id="b-prev" aria-label="前のページ">◀</button>
  <button id="b-play" aria-label="一時停止">❚❚</button>
  <button id="b-next" aria-label="次のページ">▶</button>
  <button id="b-speed" aria-label="表示速度">5秒</button>
</div>

<div id="intro">
  <h1>町に入ると、<br>その町の紹介が流れます。</h1>
  <p>GPSで今いる市町村を調べて、町の特徴・数字・ゆかりの人物・地形や気候・味と道の駅・道路の話を、短いカードで順番に表示します。進行方向の10km以内に道の駅があれば、緑の文字で知らせます。</p>
  <div class="btns">
    <button class="main" id="go-gps">スタート(GPS)</button>
    <button id="go-demo">デモを見る</button>
  </div>
</div>

<script>
(() => {
  const $ = (id) => document.getElementById(id);
  const screenEl = $("screen"), tagEl = $("tag"), panelEl = $("panel");
  const S = {
    pages: [], idx: 0, paused: false, interval: 5000, timer: null,
    town: null, lastGeo: null, watchId: null, demoIdx: -1, wake: null, loading: false,
    head: "", cat: null, cards: [], pos: null,
    trail: [], heading: null,
    eki: [], ekiFetch: null, ekiBusy: false, ekiRetryAt: 0, ekiMsg: "", ekiLevels: {}
  };
  const EKI_RANGE = 10000;                            /* この先何mまで案内するか */
  const EKI_LEVELS = [10000, 5000, 2000, 1000, 500];  /* この距離を切るたびに先頭ページで知らせる */
  const DEMO = [
    ["宮古市", "岩手県"], ["鎌倉市", "神奈川県"], ["倉敷市", "岡山県"], ["別府市", "大分県"], ["伊達市", "北海道"]
  ];
  const SPEEDS = [3000, 5000, 8000];

  /* ---------- ステータス表示 ---------- */
  function setStatus(id, text, cls) {
    const el = $(id); el.textContent = text; el.className = cls || "";
  }
  function netState() { setStatus("st-net", navigator.onLine ? "ON" : "OFF", navigator.onLine ? "ok" : "warn"); }
  addEventListener("online", netState); addEventListener("offline", netState); netState();

  /* ---------- 表示: カードごとに文字の大きさを自動調整 ---------- */
  function linesNeeded(text, cols) {
    return text.split("\n").reduce((n, ln) => n + Math.max(1, Math.ceil(ln.length / cols)), 0);
  }
  function fit(text) {
    const w = screenEl.clientWidth, h = screenEl.clientHeight;
    for (let fs = Math.min(64, Math.floor(w / 5)); fs >= 16; fs -= 2) {
      const cols = Math.max(1, Math.floor(w / fs)), lines = Math.floor(h / (fs * 1.28));
      if (linesNeeded(text, cols) * 1.06 <= lines) return fs;
    }
    return 16;
  }

  /* ページ構成: 町名 → 道の駅案内 → カード(3枚ごとに道の駅案内を挟む)。
     道の駅案内は前方に道の駅があるときだけ表示される */
  function build() {
    if (!S.cards.length && !S.head) return;
    const pages = [];
    if (S.head) pages.push({ t: S.head, title: true });
    pages.push({ eki: true });
    S.cards.forEach((c, i) => {
      pages.push(c);
      if ((i + 1) % 3 === 0 && i + 1 < S.cards.length) pages.push({ eki: true });
    });
    S.pages = pages;
    if (S.idx >= pages.length) S.idx = 0;
  }
  const visible = (p) => !p.eki || !!S.ekiMsg;
  function step(delta) {
    const n = S.pages.length; if (!n) return;
    let i = S.idx;
    for (let k = 0; k < n; k++) { i = (i + delta + n) % n; if (visible(S.pages[i])) break; }
    S.idx = i;
  }
  function pageText(p) { return p.eki ? S.ekiMsg : p.t; }
  function render() {
    if (!S.pages.length) return;
    if (!visible(S.pages[S.idx])) step(1);
    const p = S.pages[S.idx], text = pageText(p);
    const kind = p.eki ? "eki" : (p.title ? "title" : "");
    tagEl.textContent = p.eki ? "【道の駅】" : (p.tag ? "【" + p.tag + "】" : "");
    tagEl.className = kind;
    screenEl.className = kind;
    screenEl.textContent = text;
    screenEl.style.fontSize = fit(text) + "px";
    const vis = S.pages.filter(visible);
    $("pager").textContent = (vis.indexOf(p) + 1) + "/" + vis.length;
  }
  function go(delta) {
    if (!S.pages.length) return;
    step(delta); render(); schedule();
  }
  /* 文字数が多いカードは少し長めに表示する */
  function schedule() {
    clearTimeout(S.timer);
    if (S.paused || !S.pages.length) return;
    const text = pageText(S.pages[S.idx]) || "";
    const delay = S.interval * Math.min(1.6, Math.max(0.7, text.length / 70));
    S.timer = setTimeout(() => {
      if (S.pages.length > 1) { step(1); render(); }
      schedule();
    }, delay);
  }
  function jumpToEki() {
    const i = S.pages.findIndex((p) => p.eki);
    if (i < 0) return;
    S.idx = i; render(); schedule();
  }
  function showMessage(t) {
    S.pages = [{ t, title: true }]; S.idx = 0; S.head = ""; S.cards = []; S.cat = null; render(); schedule();
  }

  /* ---------- 位置 → 市町村 ---------- */
  function dist(a, b) {
    const R = 6371000, r = Math.PI / 180;
    const dLat = (b.lat - a.lat) * r, dLon = (b.lon - a.lon) * r;
    const x = Math.sin(dLat / 2) ** 2 + Math.cos(a.lat * r) * Math.cos(b.lat * r) * Math.sin(dLon / 2) ** 2;
    return 2 * R * Math.asin(Math.sqrt(x));
  }
  function bearing(a, b) {
    const r = Math.PI / 180, y = Math.sin((b.lon - a.lon) * r) * Math.cos(b.lat * r);
    const x = Math.cos(a.lat * r) * Math.sin(b.lat * r) - Math.sin(a.lat * r) * Math.cos(b.lat * r) * Math.cos((b.lon - a.lon) * r);
    return (Math.atan2(y, x) / r + 360) % 360;
  }
  const angDiff = (a, b) => Math.abs(((a - b + 540) % 360) - 180);
  const COMPASS = ["北", "北東", "東", "南東", "南", "南西", "西", "北西"];

  /* 進行方向: 走行中はGPSの方位、取れないときは直近の移動から求める。停車中は直前の向きを保つ */
  function updateHeading(c, here) {
    const last = S.trail[S.trail.length - 1];
    if (!last || dist(last, here) >= 15) { S.trail.push(here); if (S.trail.length > 10) S.trail.shift(); }
    if (c.heading != null && !isNaN(c.heading) && c.speed != null && c.speed > 1.5) { S.heading = c.heading; }
    else {
      const from = S.trail.find((p) => dist(p, here) >= 40);
      if (from) S.heading = bearing(from, here);
    }
    setStatus("st-dir", S.heading == null ? "--" : COMPASS[Math.round(S.heading / 45) % 8]);
  }

  /* ---------- 道の駅(OpenStreetMapのデータ) ---------- */
  async function loadEki(here) {
    if (S.ekiBusy || Date.now() < S.ekiRetryAt) return;
    if (S.ekiFetch && dist(S.ekiFetch, here) < 8000) return;
    S.ekiBusy = true;
    const q = '[out:json][timeout:20];nwr["name"~"^道の駅"](around:20000,' + here.lat + "," + here.lon + ");out center tags;";
    const hosts = ["https://overpass-api.de/api/interpreter", "https://overpass.kumi.systems/api/interpreter"];
    let data = null;
    for (const h of hosts) {
      try {
        const r = await fetch(h + "?data=" + encodeURIComponent(q));
        if (r.ok) { data = await r.json(); break; }
      } catch (e) { /* 次のサーバーへ */ }
    }
    S.ekiBusy = false;
    if (!data) { S.ekiRetryAt = Date.now() + 30000; return; }
    const byName = new Map();
    for (const el of data.elements || []) {
      const name = el.tags && el.tags.name; if (!name) continue;
      const pt = el.center ? { lat: el.center.lat, lon: el.center.lon } : (el.lat != null ? { lat: el.lat, lon: el.lon } : null);
      if (!pt) continue;
      const prev = byName.get(name);
      if (!prev || dist(here, pt) < dist(here, prev)) byName.set(name, { name, ...pt });
    }
    S.eki = [...byName.values()];
    S.ekiFetch = { lat: here.lat, lon: here.lon };
    if (S.cat) { assemble(); build(); }   /* 最寄りの道の駅カードを反映 */
  }
  function fmtDist(d) {
    if (d < 1000) return "約" + Math.max(100, Math.round(d / 100) * 100) + "m";
    if (d < 10000) return "約" + (Math.round(d / 100) / 10) + "km";
    return "約" + Math.round(d / 1000) + "km";
  }
  /* 進行方向の左右35度以内で、いちばん近い道の駅を案内する */
  function checkEki(here) {
    if (S.heading == null || !S.eki.length) return;
    let best = null;
    for (const s of S.eki) {
      const d = dist(here, s);
      if (d > EKI_RANGE) continue;
      const limit = d < 300 ? 60 : 35;
      if (angDiff(bearing(here, s), S.heading) > limit) continue;
      if (!best || d < best.d) best = { s, d };
    }
    if (!best) { S.ekiMsg = ""; return; }
    S.ekiMsg = best.d < 300 ? "まもなく\n" + best.s.name : "この先 " + fmtDist(best.d) + "\n" + best.s.name;
    const lv = EKI_LEVELS.filter((t) => best.d <= t).length;
    if (lv > (S.ekiLevels[best.s.name] || 0)) {
      S.ekiLevels[best.s.name] = lv;
      jumpToEki();
    } else if (S.pages[S.idx] && S.pages[S.idx].eki) {
      render();
    }
  }
  function nearestEkiCard() {
    if (!S.pos || !S.eki.length) return [];
    let best = null;
    for (const s of S.eki) { const d = dist(S.pos, s); if (!best || d < best.d) best = { s, d }; }
    if (!best || best.d > 20000) return [];
    return [{ tag: "道の駅", t: "いちばん近い道の駅は「" + best.s.name + "」。ここから" + fmtDist(best.d) + "のところです。休憩や地元の味のチェックにどうぞ。" }];
  }

  async function reverse(lat, lon) {
    const url = "https://nominatim.openstreetmap.org/reverse?format=jsonv2&zoom=14&accept-language=ja&lat=" + lat + "&lon=" + lon;
    const r = await fetch(url);
    if (!r.ok) throw new Error("geocode " + r.status);
    const j = await r.json(); const a = j.address || {};
    const name = a.city || a.town || a.village || a.municipality || a.city_district || a.county;
    const pref = a.state || a.province || a.region || "";
    return name ? { name, pref } : null;
  }
  function onPos(pos) {
    const c = pos.coords, here = { lat: c.latitude, lon: c.longitude };
    S.pos = here;
    setStatus("st-gps", "OK", "ok");
    setStatus("st-acc", Math.round(c.accuracy) + "m", c.accuracy > 100 ? "warn" : "");
    updateHeading(c, here);
    loadEki(here).then(() => checkEki(here));
    checkEki(here);
    const now = Date.now();
    const moved = !S.lastGeo || dist(S.lastGeo, here) > 250;
    const waited = !S.lastGeo || now - S.lastGeo.t > 12000;
    if (moved && waited && !S.loading) {
      S.lastGeo = { ...here, t: now };
      reverse(here.lat, here.lon).then((t) => { if (t) enterTown(t.name, t.pref); }).catch(() => {
        S.lastGeo.t = 0; setStatus("st-net", "ERR", "warn");
      });
    }
  }
  function onErr(e) {
    setStatus("st-gps", e.code === 1 ? "許可なし" : "探索中", "warn");
    if (e.code === 1) showMessage("位置情報が許可されていません。設定アプリでSafariまたはこのアプリの位置情報を許可してください。");
  }

  /* ---------- 文章の整形 ---------- */
  function clean(t) {
    return t.replace(/（[^）]*）/g, "").replace(/\([^)]*\)/g, "").replace(/\[[^\]]*\]/g, "").replace(/\s+/g, "").trim();
  }
  function sents(lines) {
    return (lines.join("").match(/[^。]+。/g) || []).map(clean).filter((s) => s.length >= 12);
  }
  /* 文をまとめて50〜100字ほどのカードにする */
  function makeCards(ss, o) {
    const out = []; let buf = "";
    for (let s of ss) {
      if (s.length > 100) {
        const k = s.lastIndexOf("、", 96);
        s = (k > 30 ? s.slice(0, k) : s.slice(0, 96)) + "…";
      }
      if (buf && (buf + s).length > 100) { out.push(buf); buf = ""; if (out.length >= o.limit) break; }
      buf += s;
      if (buf.length >= 50) { out.push(buf); buf = ""; if (out.length >= o.limit) break; }
    }
    if (buf && out.length < o.limit && buf.length >= 20) out.push(buf);
    return out.slice(0, o.limit).map((t) => ({ tag: o.tag, t }));
  }

  /* ---------- Wikipedia: 章ごとに分けて6カテゴリのカードにする ---------- */
  async function wikiPage(title) {
    const url = "https://ja.wikipedia.org/w/api.php?action=query&format=json&origin=*&redirects=1&prop=extracts|pageprops&explaintext=1&ppprop=wikibase_item|disambiguation&titles=" + encodeURIComponent(title);
    const r = await fetch(url); if (!r.ok) return null;
    const j = await r.json(); const pages = j.query && j.query.pages; if (!pages) return null;
    const p = Object.values(pages)[0];
    if (!p || p.missing !== undefined || !p.extract || p.extract.length < 100) return null;
    if (p.pageprops && p.pageprops.disambiguation !== undefined) return null;
    return { text: p.extract, qid: p.pageprops && p.pageprops.wikibase_item };
  }
  async function fetchTown(name, pref) {
    for (const t of [name, name + " (" + pref + ")", pref + name]) {
      try { const p = await wikiPage(t); if (p) return p; } catch (e) { /* 次の候補へ */ }
    }
    return null;
  }
  function parseWiki(text) {
    let cur = { name: "", level: 1, lines: [] }; const secs = [cur];
    for (const ln of text.split("\n")) {
      const m = ln.match(/^(={2,})\s*(.+?)\s*\1\s*$/);
      if (m) { cur = { name: m[2], level: m[1].length, lines: [] }; secs.push(cur); }
      else if (ln.trim()) cur.lines.push(ln.trim());
    }
    /* 見出しにあてはまる章の本文(小見出しの中身も含む) */
    return (re, shallow) => {
      const i = secs.findIndex((s, k) => k > 0 && re.test(s.name));
      if (i < 0) return [];
      const out = [...secs[i].lines];
      for (let k = i + 1; !shallow && k < secs.length && secs[k].level > secs[i].level; k++) out.push(...secs[k].lines);
      return out;
    };
  }
  function fromWikipedia(text) {
    const lead = (() => { const i = text.search(/\n={2,}/); return (i < 0 ? text : text.slice(0, i)).split("\n").map((s) => s.trim()).filter(Boolean); })();
    const sec = parseWiki(text);
    const cat = {};
    cat.catch = makeCards(sents(lead), { tag: "まち", limit: 1 });
    cat.hist = makeCards(sents(sec(/歴史|沿革/)).filter((s) => /年/.test(s)), { tag: "ゆかり", limit: 1 });
    const geo = sents(sec(/^地理$|^地形|^自然/, true));
    const clim = sents(sec(/気候/)).filter((s) => /気温|降水|降雪|雪|雨|気候|冬|夏/.test(s));
    cat.geo = [...makeCards(geo, { tag: "車窓", limit: 1 }), ...makeCards(clim, { tag: "車窓", limit: 1 })];
    let food = sents(sec(/特産|名産|名物|グルメ|食文化|郷土料理|食/));
    if (!food.length) food = sents(sec(/産業|農業|漁業/));
    cat.food = makeCards(food, { tag: "味", limit: 1 });
    const road = sents(sec(/交通/).length ? sec(/交通/) : sec(/道路/)).filter((s) => /道路|国道|高速|自動車道|インターチェンジ|バイパス|道の駅/.test(s));
    cat.road = makeCards(road, { tag: "道路", limit: 1 });
    if (!cat.catch.length) cat.catch = [{ tag: "まち", t: clean(lead.join("")).slice(0, 100) || "この町の紹介文は見つかりませんでした。" }];
    return cat;
  }

  /* ---------- Wikidata: 人口・面積・出身の有名人 ---------- */
  async function wikidataNumbers(qid) {
    const r = await fetch("https://www.wikidata.org/wiki/Special:EntityData/" + qid + ".json");
    if (!r.ok) return null;
    const e = (await r.json()).entities[qid]; const claims = (e && e.claims) || {};
    const latest = (prop) => {
      const arr = (claims[prop] || []).filter((c) => c.rank !== "deprecated" && c.mainsnak && c.mainsnak.datavalue);
      const pref = arr.filter((c) => c.rank === "preferred"); const list = pref.length ? pref : arr;
      const when = (c) => (c.qualifiers && c.qualifiers.P585 && c.qualifiers.P585[0].datavalue && c.qualifiers.P585[0].datavalue.value.time) || "";
      list.sort((a, b) => when(b).localeCompare(when(a)));
      return list[0] ? { v: list[0].mainsnak.datavalue.value, when: when(list[0]) } : null;
    };
    const pop = latest("P1082"), area = latest("P2046");
    const popN = pop ? Math.round(Number(pop.v.amount)) : null;
    const areaN = area && /Q712226$/.test(area.v.unit || "") ? Number(area.v.amount) : null;
    const parts = [];
    if (popN) {
      const y = pop.when ? "(" + pop.when.slice(1, 5) + "年)" : "";
      parts.push("人口は" + (popN >= 10000 ? "約" + (Math.round(popN / 1000) / 10) + "万人" : popN + "人") + y + "。");
    }
    if (areaN) {
      parts.push("面積は" + (Math.round(areaN * 10) / 10).toLocaleString("ja-JP") + "km²" + (popN ? "で、1km²あたり約" + Math.round(popN / areaN).toLocaleString("ja-JP") + "人。" : "。"));
    }
    return parts.length ? [{ tag: "数字", t: parts.join("") }] : null;
  }
  async function wikidataPeople(qid) {
    const q = "SELECT ?pLabel ?pDescription ?sl WHERE { ?p wdt:P19 wd:" + qid + "; wdt:P31 wd:Q5; wikibase:sitelinks ?sl. SERVICE wikibase:label { bd:serviceParam wikibase:language \"ja\". } } ORDER BY DESC(?sl) LIMIT 6";
    const r = await fetch("https://query.wikidata.org/sparql?format=json&query=" + encodeURIComponent(q));
    if (!r.ok) return null;
    const rows = ((await r.json()).results.bindings || [])
      .map((b) => ({ n: b.pLabel && b.pLabel.value, d: b.pDescription ? b.pDescription.value : "" }))
      .filter((p) => p.n && !/^Q\d+$/.test(p.n));
    if (!rows.length) return null;
    const one = (p) => p.n + (p.d ? "(" + p.d.slice(0, 18) + ")" : "");
    let text = "この町の出身者に、" + one(rows[0]);
    for (const p of rows.slice(1, 3)) { if ((text + "、" + one(p) + "などがいます。").length <= 100) text += "、" + one(p); }
    return [{ tag: "ゆかり", t: text + "などがいます。" }];
  }

  function assemble() {
    const c = S.cat || {};
    S.cards = [].concat(c.catch || [], c.num || [], c.people || [], c.hist || [], c.geo || [], c.food || [], nearestEkiCard(), c.road || []);
  }
  async function enterTown(name, pref) {
    const key = pref + name;
    if (S.town === key) return;
    S.town = key; S.loading = true;
    showMessage(name + "\nを調べています…");
    const wiki = await fetchTown(name, pref);
    if (S.town !== key) return;
    S.loading = false;
    S.head = pref + "\n" + name + "\nに入りました";
    S.cat = wiki ? fromWikipedia(wiki.text) : { catch: [{ tag: "まち", t: "この町の紹介文は見つかりませんでした。" }] };
    S.idx = 0; assemble(); build(); render(); schedule();
    if (wiki && wiki.qid) {
      /* 数字と出身者は少し遅れて届くので、届いたらカードに加える */
      const add = (field) => (v) => { if (S.town === key && v) { S.cat[field] = v; assemble(); build(); } };
      wikidataNumbers(wiki.qid).then(add("num")).catch(() => {});
      wikidataPeople(wiki.qid).then(add("people")).catch(() => {});
    }
  }

  /* ---------- 画面を点けたままにする ---------- */
  async function keepAwake() {
    try { if ("wakeLock" in navigator) S.wake = await navigator.wakeLock.request("screen"); } catch (e) { /* 非対応でも続行 */ }
  }
  document.addEventListener("visibilitychange", () => { if (document.visibilityState === "visible" && S.wake !== null) keepAwake(); });

  /* ---------- 開始 ---------- */
  function startGps() {
    $("intro").hidden = true; keepAwake();
    if (!navigator.geolocation) { setStatus("st-gps", "非対応", "warn"); showMessage("このブラウザは位置情報に対応していません。"); return; }
    setStatus("st-gps", "探索中", "warn"); showMessage("GPSを\n待っています…");
    S.watchId = navigator.geolocation.watchPosition(onPos, onErr, { enableHighAccuracy: true, maximumAge: 5000, timeout: 30000 });
  }
  function nextDemo() {
    S.demoIdx = (S.demoIdx + 1) % DEMO.length;
    const [n, p] = DEMO[S.demoIdx]; S.town = null;
    S.ekiMsg = "この先 約4.2km\n道の駅 ○○(デモ表示)";
    setStatus("st-gps", "DEMO", "warn"); setStatus("st-acc", "--");
    enterTown(n, p);
  }
  $("go-gps").onclick = startGps;
  $("go-demo").onclick = () => { $("intro").hidden = true; keepAwake(); nextDemo(); };

  $("b-prev").onclick = () => go(-1);
  $("b-next").onclick = () => go(1);
  $("b-play").onclick = () => {
    S.paused = !S.paused; $("b-play").textContent = S.paused ? "▶▶" : "❚❚";
    $("b-play").setAttribute("aria-label", S.paused ? "再開" : "一時停止"); schedule();
  };
  $("b-speed").onclick = () => {
    const i = (SPEEDS.indexOf(S.interval) + 1) % SPEEDS.length;
    S.interval = SPEEDS[i]; $("b-speed").textContent = (S.interval / 1000) + "秒"; schedule();
  };
  /* 画面タップで次のページ。長押しでデモの町に切り替え(GPS不要で動作確認できます) */
  let pressTimer = null, longPressed = false;
  panelEl.addEventListener("pointerdown", () => {
    longPressed = false;
    pressTimer = setTimeout(() => { longPressed = true; nextDemo(); }, 900);
  });
  const endPress = () => clearTimeout(pressTimer);
  panelEl.addEventListener("pointerup", endPress);
  panelEl.addEventListener("pointercancel", endPress);
  panelEl.addEventListener("click", () => { if (!longPressed) go(1); longPressed = false; });

  let rz; addEventListener("resize", () => { clearTimeout(rz); rz = setTimeout(render, 200); });
})();
</script>
</body>
